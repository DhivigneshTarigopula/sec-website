<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlanner - Admin Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f6f9; margin:0; padding:0; color: #212529; }
    header { background:#0d6efd; color:#fff; padding:15px; text-align:center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    h1 { margin:0; font-size: 24px; }
    .summary { width:95%; max-width:1250px; margin:20px auto; background:#fff; padding:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); display:flex; justify-content:space-between; align-items:center; }
    table { width:95%; max-width:1250px; margin:20px auto; border-collapse:collapse; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th, td { border:1px solid #ddd; padding:12px 10px; text-align:center; font-size: 14px; }
    th { background:#0d6efd; color:#fff; font-weight: 600; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    img.photo { width:45px; height:45px; object-fit:cover; border-radius:50%; border: 2px solid #0d6efd; }
    
    .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; margin: 2px; }
    .btn-view { background: #17a2b8; color: #fff; }
    .btn-view:hover { background: #138496; }
    .btn-delete { background:#dc3545; color:#fff; }
    .btn-delete:hover { background:#bb2d3b; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-info { background: #e0f2fe; color: #0369a1; }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-warning { background: #fef3c7; color: #b45309; }

    code.pass-badge { background: #fff3cd; color: #856404; padding: 3px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #ffeeba; }

    /* MODAL FOR STUDENT DETAILS */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff; width: 100%; max-width: 850px; max-height: 90vh;
      border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow-y: auto; text-align: left;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 15px; }
    .modal-header h2 { margin: 0; color: #0d6efd; }
    .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: #888; }
    .section-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 15px; }
    .section-box h3 { margin-top: 0; color: #333; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
    
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .detail-item { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
    .detail-item label { display: block; font-size: 12px; color: #6c757d; font-weight: bold; }
    .detail-item span { font-size: 14px; color: #212529; font-weight: 600; }
  </style>
</head>
<body>
  <!-- ADMIN AUTHENTICATION GUARD -->
  <script>
    if (sessionStorage.getItem("adminLoggedIn") !== "true") {
      const pass = prompt("🔑 Admin Portal Security Check:\nPlease enter the Admin Password:");
      if (pass === "admin@7890") {
        sessionStorage.setItem("adminLoggedIn", "true");
      } else {
        alert("Incorrect Admin Password! Access Denied.");
        window.location.href = "welcome.html";
      }
    }
  </script>

  <header>
    <h1>EduPlanner Admin Portal - Student Accounts & Insights</h1>
  </header>

  <div class="summary">
    <h2>Total Registered Students: <span id="studentCount" style="color:#0d6efd;">0</span></h2>
    <div>
      <button onclick="adminLogout()" style="padding:8px 14px; background:#dc3545; color:#fff; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin-right:10px;">Admin Logout</button>
      <a href="index.html" style="text-decoration:none; color:#0d6efd; font-weight:bold;">← Back to Welcome Page</a>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Photo</th>
        <th>Name</th>
        <th>Class</th>
        <th>Batch Year</th>
        <th>School</th>
        <th>Board</th>
        <th>Email</th>
        <th>Password</th>
        <th>Phone</th>
        <th>City/State</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentTable"></tbody>
  </table>

  <!-- STUDENT DETAILS MODAL -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalStudentName">Student Complete Details</h2>
        <button class="close-btn" onclick="closeDetailsModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    function adminLogout() {
      sessionStorage.removeItem("adminLoggedIn");
      window.location.href = "welcome.html";
    }

    function renderStudents(){
      const students = JSON.parse(localStorage.getItem("students")) || [];
      document.getElementById('studentCount').textContent = students.length;
      const table = document.getElementById('studentTable');
      table.innerHTML = "";

      if(students.length === 0) {
        table.innerHTML = `<tr><td colspan="12" style="padding:20px; color:#6c757d;">No student accounts registered yet.</td></tr>`;
        return;
      }

      students.forEach((s, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><img src="${s.photo || 'https://via.placeholder.com/150'}" class="photo" alt="Photo"></td>
          <td><strong>${s.name}</strong></td>
          <td>${s.classValue}</td>
          <td>${s.batch}</td>
          <td>${s.school}</td>
          <td><span class="badge badge-info">${s.board || 'Not set'}</span></td>
          <td>${s.email}</td>
          <td><code class="pass-badge">${s.pass}</code></td>
          <td>${s.phone}</td>
          <td>${s.city}, ${s.state}</td>
          <td><span class="badge badge-success">Active</span></td>
          <td>
            <button class="btn btn-view" onclick="viewStudentDetails(${index})">View Details</button>
            <button class="btn btn-delete" onclick="deleteStudent(${index})">Delete</button>
          </td>
        `;
        table.appendChild(row);
      });
    }

    function viewStudentDetails(index) {
      const students = JSON.parse(localStorage.getItem("students")) || [];
      const s = students[index];
      if(!s) return;

      document.getElementById("modalStudentName").textContent = `📄 Full Profile: ${s.name}`;

      const focusSubs = (s.focusSubjects && s.focusSubjects.length > 0) 
        ? s.focusSubjects.map(sub => `<span class="badge badge-info">${sub}</span>`).join(" ")
        : "<em style='color:#888;'>No focus subjects configured</em>";

      const timetableCount = s.timetable ? s.timetable.length : 0;
      const assignmentsCount = s.assignments ? s.assignments.length : 0;
      const notesCount = s.notes ? s.notes.length : 0;
      const examsCount = s.exams ? s.exams.length : 0;

      let html = `
        <div style="display:flex; gap:20px; align-items:center; margin-bottom:15px; background:#e7f1ff; padding:15px; border-radius:8px;">
          <img src="${s.photo || 'https://via.placeholder.com/150'}" style="width:70px; height:70px; border-radius:50%; object-fit:cover; border:2px solid #0d6efd;">
          <div>
            <h3 style="margin:0; color:#0d6efd;">${s.name}</h3>
            <p style="margin:4px 0 0 0; color:#555;">${s.school} | Class: ${s.classValue} | Batch Year: ${s.batch}</p>
            <p style="margin:2px 0 0 0; color:#555;">📧 <strong>Email:</strong> ${s.email} | 🔑 <strong>Password:</strong> <code class="pass-badge">${s.pass}</code></p>
            <p style="margin:2px 0 0 0; color:#555;">📞 <strong>Phone:</strong> ${s.phone} | 📍 <strong>Location:</strong> ${s.city}, ${s.state}</p>
          </div>
        </div>

        <div class="section-box">
          <h3>🎓 Academic Setup</h3>
          <p><strong>Board:</strong> <span class="badge badge-info">${s.board || 'Not set'}</span></p>
          <p><strong>Focus Subjects:</strong> ${focusSubs}</p>
        </div>

        <div class="section-box">
          <h3>📊 Platform Data Statistics</h3>
          <div class="detail-grid">
            <div class="detail-item"><label>Timetable Tasks</label><span>${timetableCount}</span></div>
            <div class="detail-item"><label>Assignments Saved</label><span>${assignmentsCount}</span></div>
            <div class="detail-item"><label>Notes Saved</label><span>${notesCount}</span></div>
            <div class="detail-item"><label>Scheduled Exams</label><span>${examsCount}</span></div>
          </div>
        </div>

        <div class="section-box">
          <h3>🚨 Scheduled Exams (${examsCount})</h3>
          ${examsCount === 0 ? '<p style="color:#888;">No exams scheduled.</p>' : s.exams.map(ex => `
            <div style="background:#fff; padding:10px; border-radius:6px; border-left:4px solid #dc3545; margin-bottom:8px;">
              <strong>${ex.title}</strong> (${ex.subject}) - Date: ${ex.date} ${ex.time || ''}<br>
              <small style="color:#555;">Portions: ${ex.portion}</small>
            </div>
          `).join('')}
        </div>

        <div class="section-box">
          <h3>📁 Saved Assignments (${assignmentsCount})</h3>
          ${assignmentsCount === 0 ? '<p style="color:#888;">No assignments saved.</p>' : s.assignments.map(a => `
            <div style="background:#fff; padding:10px; border-radius:6px; border:1px solid #ddd; margin-bottom:8px;">
              <strong>${a.title}</strong> [${a.subject}] - Due: ${a.dueDate} | Status: <span class="badge badge-warning">${a.status}</span><br>
              <small style="color:#555;">${a.details || ''}</small>
            </div>
          `).join('')}
        </div>

        <div class="section-box">
          <h3>📝 Saved Notes (${notesCount})</h3>
          ${notesCount === 0 ? '<p style="color:#888;">No notes saved.</p>' : s.notes.map(n => `
            <div style="background:#fff; padding:10px; border-radius:6px; border:1px solid #ddd; margin-bottom:8px;">
              <strong>${n.title}</strong> [${n.subject}] - Saved: ${n.date}<br>
              <small style="color:#555;">${n.content ? n.content.substring(0, 100) + '...' : ''}</small>
            </div>
          `).join('')}
        </div>
      `;

      document.getElementById("modalBody").innerHTML = html;
      document.getElementById("detailsModal").classList.add("active");
    }

    function closeDetailsModal() {
      document.getElementById("detailsModal").classList.remove("active");
    }

    function deleteStudent(index){
      let students = JSON.parse(localStorage.getItem("students")) || [];
      if(confirm("Are you sure you want to delete this student account and all associated data?")){
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        renderStudents();
      }
    }

    renderStudents();
  </script>
</body>
</html>
