<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlanner - Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; margin:0; padding:0; }
    header { background:#0d6efd; color:#fff; padding:15px; text-align:center; }
    h1 { margin:0; }
    .summary { width:95%; margin:20px auto; background:#fff; padding:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    table { width:95%; margin:20px auto; border-collapse:collapse; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    th, td { border:1px solid #ddd; padding:10px; text-align:center; }
    th { background:#0d6efd; color:#fff; }
    img.photo { max-width:50px; border-radius:5px; }
    button.delete { background:#dc3545; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; }
    button.delete:hover { background:#bb2d3b; }
  </style>
</head>
<body>
  <header>
    <h1>Admin Dashboard - Student Accounts</h1>
  </header>

  <div class="summary">
    <h2>Total Students: <span id="studentCount">0</span></h2>
  </div>

  <table>
    <thead>
      <tr>
        <th>Photo</th><th>Name</th><th>Class</th><th>Batch Year</th><th>School</th>
        <th>Email</th><th>Phone</th><th>City/State</th><th>Status</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentTable"></tbody>
  </table>

  <script>
    function renderStudents(){
      const students = JSON.parse(localStorage.getItem("students")) || [];
      document.getElementById('studentCount').textContent = students.length;
      const table = document.getElementById('studentTable');
      table.innerHTML = "";
      students.forEach((s, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><img src="${s.photo}" class="photo" alt="Photo"></td>
          <td>${s.name}</td>
          <td>${s.classValue}</td>
          <td>${s.batch}</td>
          <td>${s.school}</td>
          <td>${s.email}</td>
          <td>${s.phone}</td>
          <td>${s.city}, ${s.state}</td>
          <td>Active</td>
          <td><button class="delete" onclick="deleteStudent(${index})">Delete</button></td>
        `;
        table.appendChild(row);
      });
    }

    function deleteStudent(index){
      let students = JSON.parse(localStorage.getItem("students")) || [];
      if(confirm("Are you sure you want to delete this student?")){
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        renderStudents();
      }
    }

    renderStudents();
  </script>
</body>
</html>
