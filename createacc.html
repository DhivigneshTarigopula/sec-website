<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlanner - Create Account</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #47d3c5, #120d1c,red);
      color: #15130e;
      margin: 0;
      padding: 0;
    }
    header { color:#ea1111; padding:15px; text-align:center; }
    div { color:#170f0f; padding:15px; text-align:center; }
    form {
      background:#bcf79f; padding:20px; margin:20px auto; max-width:800px;
      border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1);
      display:grid; grid-template-columns:repeat(2,1fr); gap:15px;
    }
    form input, form button, form label { padding:10px; border-radius:5px; font-size:14px; }
    form input { border:1px solid #ccc; }
    .class-options { grid-column:span 2; display:flex; flex-wrap:wrap; gap:10px; background:#f8f9fa; padding:10px; border:1px solid #ccc; border-radius:5px; }
    form button { grid-column:span 2; background: #eea411; color:#fff; border:none; cursor:pointer; }
    form button:hover { background : #deef3d; }
  </style>
</head>
<body>
  <header>
     <div class="logo"><img src="eduplannerlogo.png" alt="EduPlanner Logo" height="200" width="400"></div>
    <h1>Create Student Account</h1>
  </header>

  <form id="signupForm">
    <input id="sName" type="text" placeholder="Student Name" required>
    <input id="sSchool" type="text" placeholder="School/Institution" required>
    <input id="sEmail" type="email" placeholder="Email" required>
    <input id="sPhone" type="tel" placeholder="Phone Number" required>
    <input id="sCity" type="text" placeholder="City" required>
    <input id="sState" type="text" placeholder="State" required>
    <input id="sBatch" type="text" placeholder="Batch Year (e.g. 2026)" required>
    <br>
    <p>Upload Photo:</p>
    <input id="sPhoto" type="file" accept="image/*" required>

    <!-- Class Selection -->
    <div class="class-options" >
      <strong>Select Class:</strong>
      <label><input type="radio" name="sClass" value="1" required>1</label>
      <label><input type="radio" name="sClass" value="2">2</label>
      <label><input type="radio" name="sClass" value="3">3</label>
      <label><input type="radio" name="sClass" value="4">4</label>
      <label><input type="radio" name="sClass" value="5">5</label>
      <label><input type="radio" name="sClass" value="6">6</label>
      <label><input type="radio" name="sClass" value="7">7</label>
      <label><input type="radio" name="sClass" value="8">8</label>
      <label><input type="radio" name="sClass" value="9">9</label>
      <label><input type="radio" name="sClass" value="10">10</label>
      <label><input type="radio" name="sClass" value="11">11</label>
      <label><input type="radio" name="sClass" value="12">12</label>
      <br>
      <label><input type="radio" name="sClass" value="UG/Bachelor's/Associate">UG/Bachelor's/Associate</label>
      <label><input type="radio" name="sClass" value="PG/Master's/Graduate">PG/Master's/Graduate</label>
      <label><input type="radio" name="sClass" value="PhD/Doctorate">PhD/Doctorate</label>
    </div>

    <!-- Passwords at the end -->
    <input id="sPass" type="password" placeholder="Enter Password" required>
    <input id="sConfirmPass" type="password" placeholder="Confirm Password" required>

    <button type="submit">Create Account</button>
  </form>

  <script>
    let students = JSON.parse(localStorage.getItem("students")) || [];

    document.getElementById('signupForm').addEventListener('submit', function(e){
      e.preventDefault();

      const pass = document.getElementById('sPass').value;
      const confirmPass = document.getElementById('sConfirmPass').value;
      if(pass !== confirmPass){
        alert("Passwords do not match!");
        return;
      }

      const name = document.getElementById('sName').value;
      const school = document.getElementById('sSchool').value;
      const email = document.getElementById('sEmail').value;
      const phone = document.getElementById('sPhone').value;
      const city = document.getElementById('sCity').value;
      const state = document.getElementById('sState').value;
      const batch = document.getElementById('sBatch').value;
      const photoFile = document.getElementById('sPhoto').files[0];
      const photoURL = photoFile ? URL.createObjectURL(photoFile) : "";
      const classValue = document.querySelector('input[name="sClass"]:checked').value;

      students.push({name, school, email, phone, pass, city, state, batch, photo: photoURL, classValue});
      localStorage.setItem("students", JSON.stringify(students));

      alert("Account created successfully!");

      // Redirect to welcome page after successful account creation
    window.location.href = "welcome.html";

      this.reset();
    });
  </script>
</body>
</html>
