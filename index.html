<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to EduPlanner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #47d3c5, #120d1c,red);
      color: #eea411;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header { padding: 40px 20px; }
    .logo {
      font-size: 80px;
      font-weight: bold;
      font-family: 'Segoe UI', sans-serif;
      letter-spacing: 5px;
      text-shadow: 2px 2px 8px rgba(236, 93, 93, 0.5);
    }
    h1 { margin-top: 20px; font-size: 36px; color: #ea1111; text-shadow: 2px 2px 16px rgba(0,0,0,0.5); }
    h2 { margin-top: 20px; font-size: 36px; color: #e65463; }
    p { max-width: 600px; margin: 20px auto; font-size: 18px; line-height: 1.6; }
    form {
      background: #bcf79f; color: #000; padding: 20px; margin: 30px auto;
      max-width: 400px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: left;
    }
    form input, form button {
      width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px;
      border: 1px solid #a22d2d; font-size: 14px;
    }
    form button {
      background: #eea411; color: #fff; border: none; cursor: pointer;
    }
    form button:hover { background: #deef3d; }
    .error { color: red; font-weight: bold; text-align: center; }
    .create-link { margin-top: 20px; }
    .create-link a { color: #fff; font-weight: bold; text-decoration: underline; }
    footer { margin-top: 60px; padding: 20px; font-size: 14px; color: #ddd; }
  </style>
</head>
<body>
  <header>
    <!-- Stylish SP Logo -->
    <div class="logo"><img src="eduplannerlogo.png" alt="EduPlanner Logo" height="200" width="400"></div>
   <marquee behavior="scroll" direction="left">
      <h1>Welcome to EduPlanner</h1>
    </marquee>
    <p>
      Fear of not having a proper time management system for your exam?<br>
      We are here to Ace your Academic Progress.<br>
    </p>
    <h2>Are you readyyyyy!!!</h2>
  </header>

  <!-- Sign In Form -->
  <form id="signinForm">
    <h2>Sign In</h2>
    <input id="signinEmail" type="email" placeholder="Enter Email" required>
    <input id="signinPass" type="password" placeholder="Enter Password" required>
    <button type="submit">Let's Go!</button>
    <p id="errorMsg" class="error"></p>
  </form>

  <!-- Create Account Link -->
  <div class="create-link">
    <p>Don't have an account? <a href="createacc.html" target="_blank">Create a new account</a></p>
  </div>

  <footer>
    © 2026 EduPlanner. All Rights Reserved.
  </footer>

  <script>
    document.getElementById('signinForm').addEventListener('submit', function(e){
      e.preventDefault();
      const email = document.getElementById('signinEmail').value;
      const pass = document.getElementById('signinPass').value;

      // Compare against accounts created in student_signup.html
      const students = JSON.parse(localStorage.getItem("students")) || [];
      const student = students.find(s => s.email === email && s.pass === pass);

      if(student){
        // Redirect to welcome page if credentials match
        window.location.href = "welcome.html";
      } else {
        // Show error message if wrong or not found
        document.getElementById('errorMsg').textContent = "Credentials are wrong or account doesn't exist.";
      }
    });
  </script>
</body>
</html>
